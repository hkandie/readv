def gradlewCmd(String moduleDir) {
    def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
    return isWindows ? ['cmd', '/c', 'gradlew.bat'] : ['./gradlew']
}

def execInModule(String moduleDir, String... taskNames) {
    providers.exec {
        workingDir moduleDir
        commandLine gradlewCmd(moduleDir) + (taskNames as List)
    }.result.get()
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs both frontend and backend unit tests'

    dependsOn ':backend:check'
    doLast { execInModule('static-host', 'frontendTest') }
}

tasks.register('frontendLint') {
    group = 'verification'
    description = 'Delegates to static-host/gradlew frontendLint'

    doLast { execInModule('static-host', 'frontendLint') }
}

tasks.register('buildFullStack') {
    group = 'build'
    description = 'Packages readva-app.jar and readva-web.jar via their own standalone Gradle wrappers'

    doLast {
        execInModule('backend', 'bootJar')
        execInModule('static-host', 'bootJar')
    }
}

tasks.register('bootLocalFrontend') {
    group = 'application'
    description = 'Delegates to static-host/gradlew bootLocalFrontend'

    doLast { execInModule('static-host', 'bootLocalFrontend') }
}
