stages:
  - test
  - security
  - deploy
  - version

variables:
  ARTIFACT_PATHS: "build/,dist/"
  CACHE_COMPRESSION_LEVEL: "fastest"
  # Veracode Configuration
  JAVA_SERVICE_OPTIONS: "-Xmx1024m -Xms512m"
  CI_DEBUG_TRACE: "false"
  CODE_VERSION: "1.0.0-${CI_PIPELINE_ID}"
  veracode_pipeline_scan: "true"
  veracode_sandbox_scan: "false"
  veracode_policy_scan: "false"
  pipeline_scan_baseline_file: "baseline.json"
  veracode_sandbox_name: "readv-sandbox"
  veracode_policy_name: "Veracode Recommended Medium"
  veracode_app_name: "readv"

include:
  - local: .gitlab/ci/frontend.yml
  - local: .gitlab/ci/backend.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/version.yml
  - project: 'security/veracode'
    ref: main
    file: veracode-scan.yml

# Global cache configuration
cache:
  key: ${CI_COMMIT_REF_SLUG}
  policy: pull-push
