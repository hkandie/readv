stages:
  - test
  - security
  - deploy
  - version

variables:
  ARTIFACT_PATHS: "build/,dist/"
  CACHE_COMPRESSION_LEVEL: "fastest"
  JAVA_SERVICE_OPTIONS: "-Xmx1024m -Xms512m"
  CI_DEBUG_TRACE: "false"
  CODE_VERSION: "1.0.0-${CI_PIPELINE_ID}"

include:
  - local: .gitlab/ci/frontend.yml
  - local: .gitlab/ci/backend.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/version.yml
  - local: .gitlab/ci/veracode.yml

# Global cache configuration
cache:
  key: ${CI_COMMIT_REF_SLUG}
  policy: pull-push
