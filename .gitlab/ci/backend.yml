# Backend CI/CD configuration

backend:test:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.gradle/
      - backend/build/
  before_script:
    - cd backend
    - chmod +x ./gradlew
  script:
    - ./gradlew clean test --no-daemon --build-cache
  artifacts:
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
    paths:
      - backend/build/test-results/
      - backend/build/reports/tests/
    expire_in: 30 days
    when: always
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

backend:build:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.gradle/
      - backend/build/
  before_script:
    - cd backend
    - chmod +x ./gradlew
  script:
    - ./gradlew clean build -x test --no-daemon --build-cache
  artifacts:
    paths:
      - backend/build/libs/
    expire_in: 30 days
    when: on_success
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  dependencies:
    - backend:test
