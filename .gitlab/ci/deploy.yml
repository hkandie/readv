deploy:backend:dev:
  extends: .deploy-linux
  tags: [linux-deploy-dev]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - update_version:files
    - build:linux:backend
  variables:
    DEPLOY_DIR: /opt/readvantage/backend
    DEPLOY_JAR_NAME: readvantage-app.jar
    DEPLOY_SERVICE: readvantage-app
    DEPLOY_DESCRIPTION: "ReadVantage backend API"
    DEPLOY_ENV_FILE: /etc/readvantage/backend.env
    DEPLOY_RESTART_POLICY: "no"
    ARTIFACT_GLOB: backend/build/libs/*.jar
    DEPLOY_PRESTART_SCRIPT: ci/scripts/fetch-k5-ticket.sh
  environment:
    name: dev

deploy:backend:qa:
  extends: .deploy-linux
  tags: [linux-deploy-qa]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - deploy:backend:dev
    - build:linux:backend
  variables:
    DEPLOY_DIR: /opt/readvantage/backend
    DEPLOY_JAR_NAME: readvantage-app.jar
    DEPLOY_SERVICE: readvantage-app
    DEPLOY_DESCRIPTION: "ReadVantage backend API"
    DEPLOY_ENV_FILE: /etc/readvantage/backend.env
    DEPLOY_RESTART_POLICY: "no"
    ARTIFACT_GLOB: backend/build/libs/*.jar
    DEPLOY_PRESTART_SCRIPT: ci/scripts/fetch-k5-ticket.sh
  environment:
    name: qa

deploy:backend:prod:
  extends: .deploy-linux
  tags: [linux-deploy-prod]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  needs:
    - deploy:backend:qa
    - build:linux:backend
  variables:
    DEPLOY_DIR: /opt/readvantage/backend
    DEPLOY_JAR_NAME: readvantage-app.jar
    DEPLOY_SERVICE: readvantage-app
    DEPLOY_DESCRIPTION: "ReadVantage backend API"
    DEPLOY_ENV_FILE: /etc/readvantage/backend.env
    DEPLOY_RESTART_POLICY: "no"
    ARTIFACT_GLOB: backend/build/libs/*.jar
    DEPLOY_PRESTART_SCRIPT: ci/scripts/fetch-k5-ticket.sh
  environment:
    name: prod

deploy:static-host:dev:
  extends: .deploy-linux
  tags: [linux-deploy-dev]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - update_version:files
    - build:linux:static-host
  variables:
    DEPLOY_DIR: /opt/readvantage/static-host
    DEPLOY_JAR_NAME: readvantage-web.jar
    DEPLOY_SERVICE: readvantage-web
    DEPLOY_DESCRIPTION: "ReadVantage web (frontend SPA embedded in static-host)"
    DEPLOY_ENV_FILE: /etc/readvantage/static-host.env
    DEPLOY_RESTART_POLICY: on-failure
    DEPLOY_RESTART_SEC: "5"
    ARTIFACT_GLOB: static-host/build/libs/*.jar
  environment:
    name: dev

deploy:static-host:qa:
  extends: .deploy-linux
  tags: [linux-deploy-qa]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - deploy:static-host:dev
    - build:linux:static-host
  variables:
    DEPLOY_DIR: /opt/readvantage/static-host
    DEPLOY_JAR_NAME: readvantage-web.jar
    DEPLOY_SERVICE: readvantage-web
    DEPLOY_DESCRIPTION: "ReadVantage web (frontend SPA embedded in static-host)"
    DEPLOY_ENV_FILE: /etc/readvantage/static-host.env
    DEPLOY_RESTART_POLICY: on-failure
    DEPLOY_RESTART_SEC: "5"
    ARTIFACT_GLOB: static-host/build/libs/*.jar
  environment:
    name: qa

deploy:static-host:prod:
  extends: .deploy-linux
  tags: [linux-deploy-prod]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  needs:
    - deploy:static-host:qa
    - build:linux:static-host
  variables:
    DEPLOY_DIR: /opt/readvantage/static-host
    DEPLOY_JAR_NAME: readvantage-web.jar
    DEPLOY_SERVICE: readvantage-web
    DEPLOY_DESCRIPTION: "ReadVantage web (frontend SPA embedded in static-host)"
    DEPLOY_ENV_FILE: /etc/readvantage/static-host.env
    DEPLOY_RESTART_POLICY: on-failure
    DEPLOY_RESTART_SEC: "5"
    ARTIFACT_GLOB: static-host/build/libs/*.jar
  environment:
    name: prod
