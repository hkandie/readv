# Deploy pipeline: bump version files, build each app once on Linux, then promote that same
# jar through dev -> qa -> prod. 

update_version:files:
  stage: update_version
  extends: .baseconfiguration
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - Set-Content -Path version.txt -Value $env:CODE_VERSION -NoNewline
    - cd frontend
    - npm version $env:CODE_VERSION --no-git-tag-version --allow-same-version
    - cd ..
    - git config user.email "ci-bot@$env:CI_SERVER_HOST"
    - git config user.name "GitLab CI"
    - git add version.txt frontend/package.json frontend/package-lock.json
    - git commit -m "[ci skip] adding version file for build $env:CODE_VERSION"
    - git push origin HEAD:$env:CI_COMMIT_BRANCH -o ci.skip
  artifacts:
    paths:
      - version.txt
      - frontend/package.json
      - frontend/package-lock.json
    expire_in: 6 weeks

.build-linux:
  stage: build
  tags: [linux-build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  script:
    - cd "$GRADLE_MODULE_DIR"
    - ./gradlew clean build -x test --no-daemon --build-cache "-PcodeVersion=$CODE_VERSION"
  artifacts:
    paths:
      - "$ARTIFACT_GLOB"
    expire_in: 6 weeks

build:linux:backend:
  extends: .build-linux
  variables:
    GRADLE_MODULE_DIR: backend
    ARTIFACT_GLOB: backend/build/libs/*.jar

build:linux:static-host:
  extends: .build-linux
  variables:
    GRADLE_MODULE_DIR: static-host
    ARTIFACT_GLOB: static-host/build/libs/*.jar

.deploy-linux:
  stage: deploy
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - Write-Host "Deploying $DEPLOY_JAR_NAME to $DEPLOY_DIR on $DEPLOY_SERVICE"
    # - install -d -m 0755 "$DEPLOY_DIR"
    # - cp $ARTIFACT_GLOB "$DEPLOY_DIR/$DEPLOY_JAR_NAME"
    # - |
    #   EXEC_START_PRE=""
    #   if [ -n "${DEPLOY_PRESTART_SCRIPT:-}" ]; then
    #     PRESTART_NAME="$(basename "$DEPLOY_PRESTART_SCRIPT")"
    #     install -m 0755 "$DEPLOY_PRESTART_SCRIPT" "$DEPLOY_DIR/$PRESTART_NAME"
    #     EXEC_START_PRE="$DEPLOY_DIR/$PRESTART_NAME"
    #   fi
    #   SERVICE_NAME="$DEPLOY_SERVICE" \
    #   SERVICE_DESCRIPTION="$DEPLOY_DESCRIPTION" \
    #   WORKING_DIR="$DEPLOY_DIR" \
    #   JAR_PATH="$DEPLOY_DIR/$DEPLOY_JAR_NAME" \
    #   ENV_FILE="$DEPLOY_ENV_FILE" \
    #   RESTART_POLICY="$DEPLOY_RESTART_POLICY" \
    #   RESTART_SEC="${DEPLOY_RESTART_SEC:-}" \
    #   EXEC_START_PRE="$EXEC_START_PRE" \
    #   ci/scripts/generate-unit-file.sh > "/tmp/${DEPLOY_SERVICE}.service"
    # - sudo install -m 0644 "/tmp/${DEPLOY_SERVICE}.service" "/etc/systemd/system/${DEPLOY_SERVICE}.service"
