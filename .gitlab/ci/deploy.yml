# Deploy pipeline: bump version files, clone the deployment repo at that
# version, then deploy to dev -> qa -> prod (prod is manual).
# Stub jobs only - script bodies to be replaced with real logic.

update_version:files:
  stage: update_version
  extends: .baseconfiguration
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - Set-Content -Path version.txt -Value $env:CODE_VERSION -NoNewline
    - cd frontend
    - npm version $env:CODE_VERSION --no-git-tag-version --allow-same-version
    - cd ..
    - git config user.email "ci-bot@$env:CI_SERVER_HOST"
    - git config user.name "GitLab CI"
    - git add version.txt frontend/package.json frontend/package-lock.json
    - git commit -m "[ci skip] adding version file for build $env:CODE_VERSION"
    - git push origin HEAD:$env:CI_COMMIT_BRANCH -o ci.skip
  artifacts:
    paths:
      - version.txt
      - frontend/package.json
      - frontend/package-lock.json
    expire_in: 6 weeks

pre_deploy:clone-config:
  stage: pre_deploy
  extends: .baseconfiguration
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - publish:backend
    - publish:static-host
  script:
    - write-output "stub: git clone --branch $env:CODE_VERSION `$env:DEPLOY_REPO_URL deploy-repo"
  artifacts:
    paths:
      - deploy-repo/
    expire_in: 1 day

.deploy:
  stage: deploy
  extends: .baseconfiguration
  script:
    - write-output "stub: deploy $env:DEPLOY_APP $env:CODE_VERSION to $env:CI_ENVIRONMENT_NAME"

deploy:backend:dev:
  extends: .deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - pre_deploy:clone-config
  variables:
    DEPLOY_APP: backend
  environment:
    name: dev

deploy:backend:qa:
  extends: .deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - deploy:backend:dev
  variables:
    DEPLOY_APP: backend
  environment:
    name: qa

deploy:backend:prod:
  extends: .deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  needs:
    - deploy:backend:qa
  variables:
    DEPLOY_APP: backend
  environment:
    name: prod

deploy:static-host:dev:
  extends: .deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - pre_deploy:clone-config
  variables:
    DEPLOY_APP: static-host
  environment:
    name: dev

deploy:static-host:qa:
  extends: .deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - deploy:static-host:dev
  variables:
    DEPLOY_APP: static-host
  environment:
    name: qa

deploy:static-host:prod:
  extends: .deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  needs:
    - deploy:static-host:qa
  variables:
    DEPLOY_APP: static-host
  environment:
    name: prod
