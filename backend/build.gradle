buildscript {
	dependencies {
		classpath 'com.fasterxml.jackson.core:jackson-core:2.19.0'
	}
}

plugins {
	id 'java'
	id 'pmd'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

pmd {
	toolVersion = '7.7.0'
	ruleSetFiles = files('config/pmd/ruleset.xml')
	ruleSets = []
}

apply from: 'testing.gradle'

tasks.named('test') {
	dependsOn tasks.named('pmdMain'), tasks.named('pmdTest')
}

tasks.register('bootRunLocal', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Runs the application with the local Spring profile active, trusting Windows Root certificates.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = tasks.named('bootRun', org.springframework.boot.gradle.tasks.run.BootRun).flatMap { it.mainClass }
	systemProperty 'spring.profiles.active', 'local'
	systemProperty 'javax.net.ssl.trustStoreType', 'WINDOWS-ROOT'
}
