spring:
  application:
    name: eadvantage-test

moauthoriser:
  jdbc:
    name: moauthoriser-test
    url: jdbc:h2:mem:moauthoriser;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.fhlbdm.eadvantage: INFO
    org.springframework: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
